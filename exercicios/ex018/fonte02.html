<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'coração';
            src: url(fontes/HEART.otf)format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'rain';
            src: url('fontes/RAINED PERSONAL USE.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de format()
            - opentype(otf)
            - truetype(ttf)
            - embedded-opentype
            - truetype-aat (apple advenced Typography)
            - svg
            */
        }

        body{
            background-color: rgba(24, 24, 194, 0.694);
            font-family: Arial, Helvetica, sans-serif
        }
        h1{
            font-family: 'rain', Times, serif;
            font-size: 3em;
            font-weight: normal;

        }
        p{
            font-family: 'coração';
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>TA CHOVENDO DEMAIS LAURA</h1>
    <p> olha essa fonte  TE AMOO!</p>
        
    </p>
    <h1>TE AMO !</h1>
</body>
</html>

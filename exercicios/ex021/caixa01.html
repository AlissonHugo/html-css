<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixas</title>
    <style>
        h1{
            /*box-level*/
           background-color: lightgray;
            height: 300px;
            width: 300px;

           
            border: 10px solid darkslategray;

            padding: 10px;
            /*10px sozinho usa por padrão todos os lados*/

            margin: 20px 20px 40px 20px;

            outline: 5px dashed pink;
        }
        a{
            /* inline-level*/
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
